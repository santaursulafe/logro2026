<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feria Tecnológica Interactiva – Día del Logro</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fuente Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --brand-primary: #06b6d4;
      --brand-secondary: #6366f1;
      --brand-accent: #f43f5e;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .brand-gradient {
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
    }
    .brand-border {
      border-color: var(--brand-primary);
    }
    .brand-text {
      color: var(--brand-primary);
    }
    /* Impresión limpia para Diploma o Código QR */
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-area, #printable-area * {
        visibility: visible;
      }
      #printable-area {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        background: #0f172a !important;
        color: white !important;
        padding: 24px;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-cyan-500 selection:text-slate-950">

  <!-- Contenedor raíz de la aplicación -->
  <div id="app" class="flex-1 flex flex-col">
    <div class="min-h-screen flex flex-col items-center justify-center p-6">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center animate-pulse shadow-lg mb-4">
        <i data-lucide="cpu" class="w-8 h-8 text-white"></i>
      </div>
      <p class="text-slate-300 font-medium tracking-wide text-sm">Cargando Feria Tecnológica Interactiva...</p>
    </div>
  </div>

  <!-- Lógica Completa + Firebase v11.6.1 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      signInAnonymously, 
      signInWithCustomToken, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // ====================================================
    // 1. INICIALIZACIÓN DE FIREBASE Y ESTADO GLOBAL
    // ====================================================
    // OPCIÓN A: Pega aquí las credenciales de tu proyecto desde Firebase Console -> Configuración del Proyecto
    const customFirebaseConfig = {
        apiKey: "AIzaSyDAL91AUf3H-UPnVBz1cEL_L3nD8J-U3cE",
  authDomain: "diadellogro-90e74.firebaseapp.com",
  projectId: "diadellogro-90e74",
  storageBucket: "diadellogro-90e74.firebasestorage.app",
  messagingSenderId: "227762248005",
  appId: "1:227762248005:web:9f832236da781030fe062c"
    };

    const appId = typeof __app_id !== 'undefined' ? __app_id : (customFirebaseConfig.projectId || 'colegio-santa-ursula-logro');

    function resolveFirebaseConfig() {
      if (customFirebaseConfig && customFirebaseConfig.apiKey && customFirebaseConfig.projectId) {
        return customFirebaseConfig;
      }
      if (window.__runtime_firebase_config && window.__runtime_firebase_config.apiKey) {
        return window.__runtime_firebase_config;
      }
      if (typeof __firebase_config !== 'undefined' && __firebase_config) {
        try {
          return JSON.parse(__firebase_config);
        } catch (e) {
          console.error("Error parseando __firebase_config:", e);
        }
      }
      return null;
    }

    let firebaseConfig = resolveFirebaseConfig();
    let app = null;
    let auth = null;
    let db = null;
    let firebaseConnected = false;

    function connectFirebaseInstance(cfg) {
      try {
        if (cfg && cfg.apiKey && cfg.projectId) {
          app = initializeApp(cfg, 'feria-app-' + Date.now());
          auth = getAuth(app);
          db = getFirestore(app);
          firebaseConnected = true;
          return true;
        }
      } catch (err) {
        console.error("Error inicializando Firebase:", err);
      }
      return false;
    }

    if (firebaseConfig && Object.keys(firebaseConfig).length > 0) {
      try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
        firebaseConnected = true;
      } catch (e) {
        console.error("Error al conectar con Firebase:", e);
      }
    }

    // Logros del Pasaporte Tecnológico (Sección 4.3)
    const ACHIEVEMENTS = [
      { id: 'first', title: 'PRIMER DESCUBRIMIENTO', desc: 'Visitó el primer stand del recorrido', threshold: 1, type: 'count', icon: 'compass', color: 'from-cyan-400 to-blue-500' },
      { id: 'exp25', title: 'EXPLORADOR', desc: 'Completó el 25 % del recorrido tecnológico', threshold: 25, type: 'percent', icon: 'rocket', color: 'from-blue-500 to-indigo-600' },
      { id: 'inn50', title: 'INNOVADOR', desc: 'Completó el 50 % del recorrido tecnológico', threshold: 50, type: 'percent', icon: 'zap', color: 'from-purple-500 to-pink-500' },
      { id: 'exp75', title: 'EXPERTO TECNOLÓGICO', desc: 'Completó el 75 % del recorrido tecnológico', threshold: 75, type: 'percent', icon: 'cpu', color: 'from-amber-400 to-orange-500' },
      { id: 'mas100', title: 'MAESTRO DIGITAL', desc: '¡Completó el 100 % de los stands del evento!', threshold: 100, type: 'percent', icon: 'trophy', color: 'from-emerald-400 to-teal-600' }
    ];

    // Configuración Institucional Inicial Vacía (Sin datos falsos ni inventados - Sección 2.4)
    const EMPTY_CONFIG = {
      isConfigured: false,
      isPublished: false,
      schoolName: '',
      eventName: '',
      areaName: '',
      heroTitle: '',
      heroSubtitle: '',
      welcomeMessage: '',
      motto: '',
      eventDate: '',
      logoUrl: '',
      logoSize: 88,
      logoPosition: 'center',
      bannerUrl: '',
      primaryColor: '#06b6d4',
      secondaryColor: '#6366f1',
      accentColor: '#f43f5e',
      passportEnabled: true
    };

    // Estado reactivo centralizado
    const state = {
      user: null,
      dbLoading: true,
      config: { ...EMPTY_CONFIG },
      formConfig: { ...EMPTY_CONFIG },
      themes: [],
      stands: [],
      visitors: [],
      visits: [],

      // Navegación general
      appMode: 'visitor', // 'visitor' | 'admin'
      isAdminUnlocked: false,
      adminLoginError: '',
      adminTab: 'dashboard', // 'dashboard' | 'home_editor' | 'themes' | 'stands' | 'passport' | 'visitors' | 'firebase_setup'
      previewDevice: 'mobile', // 'mobile' | 'desktop'
      firebaseJsonInput: '',

      // Flujo del Visitante (Etapas directas: Registro -> Bienvenida -> Temas -> Stands del Tema -> Ficha de Stand)
      currentVisitorId: null,
      visitorStep: 'register', // 'register' | 'welcome' | 'themes' | 'theme_stands' | 'stand' | 'all_projects'
      selectedThemeId: null,
      selectedStandId: null,
      projectSearch: '',
      visitorSearch: '',
      regError: '',

      // Modales
      isPassportOpen: false,
      isDiplomaOpen: false,
      confirmVisitStandId: null,
      unlockedBadgeQueue: [],
      toast: null,

      // Formularios de edición en Admin
      editingTheme: { id: null, name: '', description: '', objective: '', imageUrl: '', grades: '', order: 1, status: 'published' },
      editingStand: {
        id: null, code: '', name: '', themeId: '', grade: '', section: '',
        projectName: '', description: '', objective: '', results: '', extraInfo: '',
        members: [], links: [], status: 'published', inPassport: true
      }
    };

    // ====================================================
    // 2. UTILIDADES (ESCAPADO HTML, IMÁGENES Y TOAST)
    // ====================================================
    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'info') {
      state.toast = { message, type };
      renderApp();
      setTimeout(() => {
        if (state.toast && state.toast.message === message) {
          state.toast = null;
          renderApp();
        }
      }, 3600);
    }

    function compressImageToDataUrl(file, maxWidth = 420) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          if (file.type === 'image/svg+xml') {
            resolve(event.target.result);
            return;
          }
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const scale = Math.min(1, maxWidth / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
            resolve(canvas.toDataURL(mime, 0.82));
          };
          img.onerror = reject;
          img.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ====================================================
    // 3. CÁLCULOS DERIVADOS DEL PASAPORTE Y ESTADÍSTICAS
    // ====================================================
    function getDerivedData() {
      const currentVisitor = state.visitors.find(v => v.id === state.currentVisitorId) || null;
      const publishedThemes = state.themes.filter(t => t.status === 'published');
      const publishedStands = state.stands.filter(s => s.status === 'published');
      const passportStands = publishedStands.filter(s => s.inPassport !== false);

      const myVisits = state.currentVisitorId
        ? state.visits.filter(v => v.visitorId === state.currentVisitorId)
        : [];
      const myVisitedStandIds = new Set(myVisits.map(v => v.standId));

      const total = passportStands.length;
      const visitedCount = passportStands.filter(s => myVisitedStandIds.has(s.id)).length;
      const percentage = total > 0 ? Number(((visitedCount / total) * 100).toFixed(1)) : 0;

      const earnedBadges = ACHIEVEMENTS.filter(ach => {
        if (total === 0) return false;
        if (ach.type === 'count') return visitedCount >= ach.threshold;
        return percentage >= ach.threshold;
      });

      const pendingStands = passportStands.filter(s => !myVisitedStandIds.has(s.id));

      return {
        currentVisitor,
        publishedThemes,
        publishedStands,
        passportStands,
        myVisitedStandIds,
        passportProgress: {
          total,
          visitedCount,
          percentage,
          earnedBadges,
          pendingStands,
          isCompleted: total > 0 && visitedCount === total
        }
      };
    }

    // ====================================================
    // 4. CONEXIÓN CON FIREBASE AUTH Y FIRESTORE
    // ====================================================
    async function initFirebase() {
      if (!auth || !db) {
        state.dbLoading = false;
        renderApp();
        return;
      }

      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        console.error("Error de autenticación:", err);
      }

      onAuthStateChanged(auth, (user) => {
        state.user = user;
        if (user) {
          subscribeCollections();
        } else {
          state.dbLoading = false;
          renderApp();
        }
      });
    }

    function subscribeCollections() {
      if (!state.user) return;

      const settingsRef = collection(db, 'artifacts', appId, 'public', 'data', 'settings');
      const themesRef = collection(db, 'artifacts', appId, 'public', 'data', 'themes');
      const standsRef = collection(db, 'artifacts', appId, 'public', 'data', 'stands');
      const visitorsRef = collection(db, 'artifacts', appId, 'public', 'data', 'visitors');
      const visitsRef = collection(db, 'artifacts', appId, 'public', 'data', 'visits');

      onSnapshot(settingsRef, (snap) => {
        const docSnap = snap.docs.find(d => d.id === 'institutional_config');
        if (docSnap) {
          const loaded = { ...EMPTY_CONFIG, ...docSnap.data() };
          const wasUnconfigured = !state.config.isConfigured;
          state.config = loaded;
          if (wasUnconfigured) {
            state.formConfig = { ...loaded };
          }
        } else {
          state.config = { ...EMPTY_CONFIG };
          state.adminTab = 'home_editor';
        }
        state.dbLoading = false;
        updateBrandColors();
        renderApp();
      }, (err) => {
        console.error("Error en settings:", err);
        state.dbLoading = false;
        renderApp();
      });

      onSnapshot(themesRef, (snap) => {
        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        list.sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
        state.themes = list;
        renderApp();
      }, (err) => console.error("Error en themes:", err));

      onSnapshot(standsRef, (snap) => {
        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        list.sort((a, b) => (a.code || '').localeCompare(b.code || ''));
        state.stands = list;
        renderApp();
      }, (err) => console.error("Error en stands:", err));

      onSnapshot(visitorsRef, (snap) => {
        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        state.visitors = list;
        renderApp();
      }, (err) => console.error("Error en visitors:", err));

      onSnapshot(visitsRef, (snap) => {
        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        state.visits = list;
        renderApp();
      }, (err) => console.error("Error en visits:", err));
    }

    function updateBrandColors() {
      const root = document.documentElement;
      root.style.setProperty('--brand-primary', state.config.primaryColor || '#06b6d4');
      root.style.setProperty('--brand-secondary', state.config.secondaryColor || '#6366f1');
      root.style.setProperty('--brand-accent', state.config.accentColor || '#f43f5e');
    }

    // ====================================================
    // 5. ACCIONES INTERACTIVAS GLOBALES (WINDOW HANDLERS)
    // ====================================================
    window.appActions = {
      setAppMode(mode) {
        state.appMode = mode;
        state.adminLoginError = '';
        renderApp();
      },

      setAdminTab(tab) {
        state.adminTab = tab;
        renderApp();
      },

      unlockAdmin(e) {
        if (e) e.preventDefault();
        const pwdEl = document.getElementById('admin-password-input');
        const entered = pwdEl ? pwdEl.value.trim() : '';

        if (entered !== 'sufe2026') {
          state.adminLoginError = 'Contraseña incorrecta. Acceso denegado.';
          renderApp();
          return;
        }

        state.adminLoginError = '';
        state.isAdminUnlocked = true;
        if (!state.config.isConfigured) {
          state.adminTab = 'home_editor';
        }
        showToast('Acceso autorizado al Panel de Administración.', 'success');
      },

      lockAdminSession() {
        state.isAdminUnlocked = false;
        state.adminLoginError = '';
        state.appMode = 'visitor';
        showToast('Sesión administrativa cerrada.', 'info');
      },

      setVisitorStep(step) {
        state.visitorStep = step;
        renderApp();
      },

      selectTheme(themeId) {
        state.selectedThemeId = themeId;
        state.visitorStep = 'theme_stands';
        renderApp();
      },

      openStand(standId) {
        const st = state.stands.find(s => s.id === standId);
        if (!st) return;
        state.selectedThemeId = st.themeId;
        state.selectedStandId = st.id;
        state.visitorStep = 'stand';
        state.isPassportOpen = false;
        renderApp();
      },

      resetVisitorSession() {
        state.currentVisitorId = null;
        state.visitorStep = 'register';
        renderApp();
      },

      togglePassport(open) {
        state.isPassportOpen = open;
        renderApp();
      },

      toggleDiploma(open) {
        state.isDiplomaOpen = open;
        if (open) state.isPassportOpen = false;
        renderApp();
      },

      openConfirmVisitModal(standId) {
        state.confirmVisitStandId = standId;
        renderApp();
      },

      dismissBadgeModal() {
        state.unlockedBadgeQueue.shift();
        renderApp();
      },

      updateProjectSearch(val) {
        state.projectSearch = val;
        renderApp();
      },

      updateVisitorSearch(val) {
        state.visitorSearch = val;
        renderApp();
      },

      setPreviewDevice(dev) {
        state.previewDevice = dev;
        renderApp();
      },

      // Registro del Visitante (Etapa 1)
      async registerVisitor(e) {
        e.preventDefault();
        const inputEl = document.getElementById('visitor-fullname-input');
        const raw = inputEl ? inputEl.value : '';
        const cleaned = raw.replace(/\s+/g, ' ').trim();

        if (!cleaned) {
          state.regError = 'Por favor ingresa tus nombres y apellidos.';
          renderApp();
          return;
        }
        const parts = cleaned.split(' ');
        if (parts.length < 2 || cleaned.length < 5) {
          state.regError = 'Ingresa tu nombre y al menos un apellido válido.';
          renderApp();
          return;
        }

        state.regError = '';
        const normalized = cleaned.toLowerCase();
        const existing = state.visitors.find(v => (v.normalizedName || v.fullName?.toLowerCase()) === normalized);

        try {
          let visitorId = null;
          if (existing) {
            visitorId = existing.id;
            showToast(`¡Bienvenido de nuevo, ${existing.fullName}! Retomando tu recorrido.`, 'info');
          } else {
            const now = new Date();
            const payload = {
              fullName: cleaned,
              normalizedName: normalized,
              date: now.toLocaleDateString('es-PE'),
              time: now.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' }),
              timestamp: Date.now()
            };
            if (db && state.user) {
              const docRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'visitors'), payload);
              visitorId = docRef.id;
            } else {
              visitorId = 'local_' + Date.now();
              state.visitors.unshift({ id: visitorId, ...payload });
            }
            showToast('Registro completado con éxito.', 'success');
          }

          state.currentVisitorId = visitorId;
          state.visitorStep = 'welcome';
          renderApp();
        } catch (err) {
          console.error("Error registrando visitante:", err);
          showToast('Error al registrar visitante.', 'error');
        }
      },

      // Confirmar visita a un stand (Etapa 5 y Sección 4)
      async confirmStandVisit() {
        const { currentVisitor, passportStands, myVisitedStandIds } = getDerivedData();
        const stand = state.stands.find(s => s.id === state.confirmVisitStandId);
        if (!currentVisitor || !stand) return;

        // Validar duplicados
        if (myVisitedStandIds.has(stand.id)) {
          state.confirmVisitStandId = null;
          showToast('Este stand ya fue registrado en tu Pasaporte Tecnológico.', 'info');
          return;
        }

        const prevTotal = passportStands.length;
        const prevCount = passportStands.filter(s => myVisitedStandIds.has(s.id)).length;
        const prevPct = prevTotal > 0 ? (prevCount / prevTotal) * 100 : 0;

        const now = new Date();
        const visitDocId = `${currentVisitor.id}_${stand.id}`;
        const visitPayload = {
          visitorId: currentVisitor.id,
          visitorName: currentVisitor.fullName,
          standId: stand.id,
          standCode: stand.code,
          standName: stand.name,
          date: now.toLocaleDateString('es-PE'),
          time: now.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' }),
          timestamp: Date.now()
        };

        try {
          if (db && state.user) {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'visits', visitDocId), visitPayload);
          } else {
            state.visits.unshift({ id: visitDocId, ...visitPayload });
          }

          const nextCount = passportStands.some(s => s.id === stand.id) ? prevCount + 1 : prevCount;
          const nextPct = prevTotal > 0 ? (nextCount / prevTotal) * 100 : 0;

          const newlyUnlocked = ACHIEVEMENTS.filter(ach => {
            if (prevTotal === 0) return false;
            const hadBefore = ach.type === 'count' ? prevCount >= ach.threshold : prevPct >= ach.threshold;
            const hasNow = ach.type === 'count' ? nextCount >= ach.threshold : nextPct >= ach.threshold;
            return !hadBefore && hasNow;
          });

          state.confirmVisitStandId = null;
          if (newlyUnlocked.length > 0) {
            state.unlockedBadgeQueue.push(...newlyUnlocked);
          }
          showToast(`¡Visita confirmada en ${stand.code} - ${stand.name}!`, 'success');

          if (prevTotal > 0 && nextCount === prevTotal && prevCount < prevTotal) {
            setTimeout(() => {
              state.isDiplomaOpen = true;
              renderApp();
            }, 1100);
          } else {
            renderApp();
          }
        } catch (err) {
          console.error("Error guardando visita:", err);
          showToast('No se pudo registrar la visita.', 'error');
        }
      },

      // Compartir o Imprimir Diploma
      printCurrentView() {
        window.print();
      },

      shareDiploma() {
        const shareText = `¡He completado el 100% del recorrido tecnológico en ${state.config.eventName} de ${state.config.schoolName}!`;
        const textarea = document.createElement('textarea');
        textarea.value = shareText;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('Reconocimiento copiado al portapapeles listo para compartir.', 'success');
      },

      // ====================================================
      // ACCIONES DEL PANEL ADMINISTRATIVO (SECCIÓN 2 Y 6)
      // ====================================================
      syncFormConfigFromInputs() {
        const getVal = (id) => {
          const el = document.getElementById(id);
          return el ? el.value : '';
        };
        state.formConfig = {
          ...state.formConfig,
          schoolName: getVal('cfg-schoolName'),
          eventName: getVal('cfg-eventName'),
          areaName: getVal('cfg-areaName'),
          eventDate: getVal('cfg-eventDate'),
          heroTitle: getVal('cfg-heroTitle'),
          heroSubtitle: getVal('cfg-heroSubtitle'),
          motto: getVal('cfg-motto'),
          welcomeMessage: getVal('cfg-welcomeMessage'),
          logoUrl: getVal('cfg-logoUrl'),
          logoSize: Number(getVal('cfg-logoSize')) || 88,
          logoPosition: getVal('cfg-logoPosition') || 'center',
          bannerUrl: getVal('cfg-bannerUrl'),
          primaryColor: getVal('cfg-primaryColor') || '#06b6d4',
          secondaryColor: getVal('cfg-secondaryColor') || '#6366f1',
          accentColor: getVal('cfg-accentColor') || '#f43f5e'
        };
        renderApp();
      },

      async handleLogoFile(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const dataUrl = await compressImageToDataUrl(file, 360);
          state.formConfig.logoUrl = dataUrl;
          showToast('Logo oficial cargado en la vista previa.', 'success');
        } catch (err) {
          showToast('Error al procesar el archivo de logo.', 'error');
        }
      },

      async handleBannerFile(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        try {

      async saveStand(e) {
        e.preventDefault();

        if (!st.code.trim() || !st.name.trim() || !st.themeId) {
          showToast('Completa el código, nombre del stand y tema principal.', 'error');

          currentLinks.push({ label, url: finalUrl });

        const payload = {
          code: st.code.trim().toUpperCase(),
          name: st.name.trim(),
          projectName: st.projectName.trim(),
          themeId: st.themeId,
          grade: st.grade.trim(),
          section: st.section.trim(),
          description: st.description.trim(),
          objective: st.objective.trim(),
          results: st.results.trim(),
          extraInfo: st.extraInfo.trim(),
          members: st.members || [],
          links: currentLinks,
          status: st.status || 'published',
          inPassport: st.inPassport !== false
        };

        try {
          if (st.id) {
            const idx = state.stands.findIndex(item => item.id === st.id);
            if (idx !== -1) state.stands[idx] = { id: st.id, ...payload };
            if (db && state.user && !String(st.id).startsWith('local_')) {
              await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'stands', st.id), payload);

            if (db && state.user) {
              await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'stands'), payload);

              state.stands.push({ id: 'local_stand_' + Date.now(), ...payload });

          state.editingStand = {
            id: null, code: '', name: '', themeId: '', grade: '', section: '',

          };

          state.stands.push({ id: 'local_stand_' + Date.now(), ...payload });

            id: null, code: '', name: '', themeId: '', grade: '', section: '',
            projectName: '', description: '', objective: '', results: '', extraInfo: '',
            members: [], links: [], status: 'published', inPassport: true
          };

          renderApp();

      // Conectar Firebase pegando el objeto JSON desde el Panel Admin
      async applyRuntimeFirebaseConfig(e) {
        if (e) e.preventDefault();
        const rawInput = document.getElementById('firebase-json-config-input')?.value || '';
        if (!rawInput.trim()) {
          showToast('Pega el bloque firebaseConfig de tu consola de Firebase.', 'error');
          return;
        }
        try {
          // Limpiar si el usuario pega "const firebaseConfig = { ... };"
          const jsonText = rawInput
            .replace(/^[^{]*({[\s\S]*})[^}]*$/, '$1')
            .replace(/(\w+)\s*:/g, '"$1":')
            .replace(/'/g, '"')
            .replace(/,\s*}/g, '}');
          const parsed = JSON.parse(jsonText);
          if (!parsed.apiKey || !parsed.projectId) {
            showToast('El objeto debe incluir al menos "apiKey" y "projectId".', 'error');
            return;
          }
          window.__runtime_firebase_config = parsed;
          const ok = connectFirebaseInstance(parsed);
          if (ok) {
            await initFirebase();
            showToast(`¡Conectado exitosamente al proyecto "${parsed.projectId}"!`, 'success');
          } else {
            showToast('No se pudo inicializar Firebase con esos datos.', 'error');
          }
        } catch (err) {
          console.error(err);
          showToast('Formato inválido. Asegúrate de pegar las llaves { apiKey: "...", projectId: "..." }', 'error');
        }
      }
    };

              <button onclick="appActions.setVisitorStep('themes')" class="${state.visitorStep === 'themes' ? 'text-cyan-400 font-bold' : 'text-slate-300 hover:text-white'}">Estaciones Temáticas</button>
              ${state.visitorStep === 'theme_stands' ? `<i data-lucide="chevron-right" class="w-4 h-4 text-slate-600"></i><span class="text-cyan-400 font-bold">Stands del Tema</span>` : ''}
              ${state.visitorStep === 'stand' ? `<i data-lucide="chevron-right" class="w-4 h-4 text-slate-600"></i><span class="text-cyan-400 font-bold">Ficha de Stand</span>` : ''}
            </div>
            <div class="flex items-center gap-2">
              <button onclick="appActions.setVisitorStep('all_projects')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 border border-slate-800 text-slate-300 hover:text-white">
                Todos los Stands (${publishedStands.length})
              </button>
              <button onclick="appActions.resetVisitorSession()" class="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-white text-xs border border-slate-800">
                Cambiar Visitante
              </button>
            </div>
          </div>
        </div>
      `;

      // CATÁLOGO COMPLETO DE PROYECTOS
      if (state.visitorStep === 'all_projects') {
        const q = state.projectSearch.toLowerCase();
        const filtered = publishedStands.filter(s =>
          (s.name || '').toLowerCase().includes(q) ||
          (s.projectName || '').toLowerCase().includes(q) ||
          (s.code || '').toLowerCase().includes(q)
        );
        return `
          <div class="flex-1 flex flex-col pb-24">
            ${subHeader}
            <div class="max-w-7xl mx-auto w-full p-4 sm:p-6 space-y-6">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                  <h2 class="text-2xl font-extrabold text-white">Todos los Proyectos Tecnológicos</h2>
                  <p class="text-sm text-slate-400">Selecciona cualquier stand para abrir su ficha digital</p>
                </div>
                <input type="text" value="${esc(state.projectSearch)}" oninput="appActions.updateProjectSearch(this.value)" placeholder="Buscar proyecto o código..." class="w-full sm:w-72 px-4 py-2.5 rounded-2xl bg-slate-900 border border-slate-800 text-sm text-white" />
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                ${filtered.map(st => {
                  const visited = myVisitedStandIds.has(st.id);
                  return `
                    <div onclick="appActions.openStand('${esc(st.id)}')" class="cursor-pointer bg-slate-900 border border-slate-800 hover:border-cyan-500/50 rounded-3xl p-5 flex flex-col justify-between transition">
                      <div>
                        <div class="flex items-center justify-between mb-3">
                          <span class="px-2.5 py-1 rounded-xl bg-cyan-500/15 text-cyan-300 font-extrabold text-xs">${esc(st.code)}</span>
                          <span class="px-2.5 py-1 rounded-xl text-xs font-bold ${visited ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-400'}">${visited ? '✓ Visitado' : 'Pendiente'}</span>
                        </div>
                        <h3 class="text-lg font-bold text-white">${esc(st.projectName || st.name)}</h3>
                        <p class="text-xs text-cyan-300 mt-1">${esc(st.name)} • ${esc(st.grade)} "${esc(st.section)}"</p>
                        <p class="text-xs text-slate-400 mt-3 line-clamp-2">${esc(st.description)}</p>
                      </div>
                      <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between text-xs">
                        <span class="text-slate-400">${(st.members || []).length} integrantes</span>
                        <span class="text-cyan-400 font-bold">Abrir Ficha →</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      }

      // ETAPA 3: EXPLORADOR GENERAL DE TEMAS
      if (state.visitorStep === 'themes') {
        return `
          <div class="flex-1 flex flex-col pb-24">
            ${subHeader}
            <div class="max-w-7xl mx-auto w-full p-4 sm:p-6 space-y-6">
              <div>
                <span class="text-xs font-bold uppercase tracking-widest text-cyan-400">Recorrido por Estaciones</span>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-white mt-1">Explorador General de Temas</h2>
                <p class="text-sm text-slate-400 mt-1">Explora las estaciones temáticas cargadas dinámicamente por el área responsable.</p>
              </div>

              ${publishedThemes.length === 0 ? `
                <div class="bg-slate-900/70 border border-slate-800 rounded-3xl p-12 text-center max-w-xl mx-auto">
                  <i data-lucide="layers" class="w-12 h-12 text-cyan-400 mx-auto mb-3"></i>
                  <h3 class="text-lg font-bold text-white">Aún no hay estaciones temáticas publicadas</h3>
                  <p class="text-sm text-slate-400 mt-1">El administrador puede registrar los temas desde el Panel Administrativo.</p>
                </div>
              ` : `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  ${publishedThemes.map((t, idx) => {
                    const tStands = publishedStands.filter(s => s.themeId === t.id);
                    const visitedInTheme = tStands.filter(s => myVisitedStandIds.has(s.id)).length;
                    const pct = tStands.length > 0 ? Math.round((visitedInTheme / tStands.length) * 100) : 0;

                    return `
                      <div class="bg-slate-900/90 border border-slate-800 hover:border-cyan-500/50 rounded-3xl overflow-hidden shadow-xl flex flex-col justify-between transition">
                        <div>
                          <div class="h-44 bg-slate-950 relative overflow-hidden">
                            ${t.imageUrl ? `<img src="${esc(t.imageUrl)}" alt="${esc(t.name)}" class="w-full h-full object-cover" />` : `
                              <div class="w-full h-full flex items-center justify-center brand-gradient opacity-30">
                                <i data-lucide="cpu" class="w-14 h-14 text-white"></i>
                              </div>
                            `}
                            <div class="absolute top-3 left-3 px-3 py-1 rounded-xl bg-slate-950/85 text-xs font-extrabold text-cyan-400 border border-white/10">
                              ESTACIÓN #${esc(t.order || idx + 1)}
                            </div>
                            ${t.grades ? `<div class="absolute top-3 right-3 px-3 py-1 rounded-xl bg-indigo-950/90 text-[11px] font-bold text-indigo-200">${esc(t.grades)}</div>` : ''}
                          </div>

                          <div class="p-5">
                            <h3 class="text-xl font-extrabold text-white">${esc(t.name)}</h3>
                            <p class="text-xs sm:text-sm text-slate-300 mt-2 line-clamp-3">${esc(t.description)}</p>

                            <div class="mt-4 p-3 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-between">
                              <span class="text-xs text-slate-400 uppercase font-semibold">Stands en este tema</span>
                              <span class="text-sm font-extrabold text-cyan-400">${tStands.length} Stands</span>
                            </div>

                            <div class="mt-4">
                              <div class="flex justify-between text-xs mb-1">
                                <span class="text-slate-400">Progreso en estación</span>
                                <span class="font-bold text-cyan-400">${visitedInTheme}/${tStands.length} (${pct}%)</span>
                              </div>
                              <div class="w-full h-2 rounded-full bg-slate-950 overflow-hidden">
                                <div class="h-full brand-gradient rounded-full" style="width: ${pct}%"></div>
                              </div>
                            </div>
                          </div>
                        </div>

                        <div class="p-5 pt-0">
                          <button onclick="appActions.selectTheme('${esc(t.id)}')" class="w-full py-3 px-4 rounded-2xl brand-gradient text-white font-bold text-xs uppercase tracking-wider shadow-lg flex items-center justify-center gap-2">
                            <span>EXPLORAR STANDS DEL TEMA</span>
                            <i data-lucide="chevron-right" class="w-4 h-4"></i>
                          </button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>
          </div>
        `;
      }

      // ETAPA 4: STANDS DEL TEMA SELECCIONADO
      if (state.visitorStep === 'theme_stands') {
        const activeTheme = publishedThemes.find(t => t.id === state.selectedThemeId) || publishedThemes[0];
        const filteredStands = publishedStands.filter(s => s.themeId === activeTheme?.id);

        return `
          <div class="flex-1 flex flex-col pb-24">
            ${subHeader}
            <div class="max-w-7xl mx-auto w-full p-4 sm:p-6 space-y-6">
              <button onclick="appActions.setVisitorStep('themes')" class="inline-flex items-center gap-2 text-xs font-bold text-cyan-400">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Volver a Estaciones Temáticas</span>
              </button>

              ${activeTheme ? `
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                  <span class="text-xs font-bold uppercase text-cyan-400">Estación #${esc(activeTheme.order || 1)} ${activeTheme.grades ? `• ${esc(activeTheme.grades)}` : ''}</span>
                  <h2 class="text-2xl sm:text-3xl font-extrabold text-white mt-1">${esc(activeTheme.name)}</h2>
                  <p class="text-sm text-slate-300 mt-2">${esc(activeTheme.description)}</p>
                  ${activeTheme.objective ? `<p class="text-xs text-cyan-300 mt-2"><strong>Objetivo:</strong> ${esc(activeTheme.objective)}</p>` : ''}
                </div>
              ` : ''}

              ${filteredStands.length === 0 ? `
                <div class="bg-slate-900/70 border border-slate-800 rounded-3xl p-10 text-center">
                  <p class="text-sm text-slate-400">Aún no hay stands registrados en este tema.</p>
                </div>
              ` : `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  ${filteredStands.map(st => {
                    const visited = myVisitedStandIds.has(st.id);
                    return `
                      <div onclick="appActions.openStand('${esc(st.id)}')" class="cursor-pointer bg-slate-900 border border-slate-800 hover:border-cyan-500/50 rounded-3xl p-5 flex flex-col justify-between transition">
                        <div>
                          <div class="flex items-center justify-between mb-3">
                            <span class="px-2.5 py-1 rounded-xl bg-cyan-500/15 text-cyan-300 font-extrabold text-xs">${esc(st.code)}</span>
                            <span class="px-2.5 py-1 rounded-xl text-xs font-bold ${visited ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-400'}">${visited ? '✓ Visitado' : 'Pendiente'}</span>
                          </div>
                          <h4 class="text-lg font-bold text-white">${esc(st.projectName || st.name)}</h4>
                          <p class="text-xs text-cyan-300 mt-1">${esc(st.name)} • ${esc(st.grade)} "${esc(st.section)}"</p>
                          <p class="text-xs text-slate-300 mt-3 line-clamp-3">${esc(st.description)}</p>
                        </div>
                        <button class="mt-4 w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-300 font-bold text-xs">
                          Abrir Ficha Digital →
                        </button>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>
          </div>
        `;
      }

      // ETAPA 5: FICHA DIGITAL INDIVIDUAL DEL STAND
      if (state.visitorStep === 'stand') {
        const stand = publishedStands.find(s => s.id === state.selectedStandId);
        if (!stand) {
          return `<div class="p-8 text-center"><p>Stand no encontrado.</p></div>`;
        }
        const themeObj = state.themes.find(t => t.id === stand.themeId);
        const isVisited = myVisitedStandIds.has(stand.id);

        return `
          <div class="flex-1 flex flex-col pb-24">
            ${subHeader}
            <div class="max-w-5xl mx-auto w-full p-4 sm:p-6 space-y-6">
              <button onclick="appActions.setVisitorStep('theme_stands')" class="inline-flex items-center gap-2 text-xs font-bold text-cyan-400">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Volver a los Stands del Tema</span>
              </button>

              <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
                <div class="p-6 sm:p-8 border-b border-slate-800">
                  <div class="flex flex-wrap items-center justify-between gap-3">
                    <div class="flex items-center gap-2.5">
                      <span class="px-3.5 py-1.5 rounded-xl brand-gradient text-white font-extrabold text-sm">STAND ${esc(stand.code)}</span>
                      <span class="px-3 py-1 rounded-xl bg-slate-950 border border-slate-800 text-xs font-bold text-slate-300">${esc(stand.grade)} "${esc(stand.section)}"</span>
                    </div>
                    ${isVisited ? `
                      <span class="px-4 py-2 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs font-extrabold">
                        ✓ STAND VISITADO Y REGISTRADO
                      </span>
                    ` : `
                      <span class="px-3 py-1 rounded-xl bg-amber-500/15 border border-amber-500/30 text-amber-300 text-xs font-semibold">
                        Visita pendiente de confirmar
                      </span>
                    `}
                  </div>

                  <h1 class="text-2xl sm:text-4xl font-extrabold text-white mt-4">${esc(stand.projectName || stand.name)}</h1>
                  <p class="text-base text-cyan-300 font-semibold mt-1">${esc(stand.name)}</p>

                  <div class="flex flex-wrap gap-3 mt-4 text-xs text-slate-400">
                    ${themeObj ? `<span class="px-3 py-1 rounded-lg bg-slate-950 border border-slate-800"><strong class="text-slate-200">Tema Principal:</strong> ${esc(themeObj.name)}</span>` : ''}
                  </div>
                </div>

                <div class="p-6 sm:p-8 space-y-6">
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="p-5 rounded-2xl bg-slate-950/70 border border-slate-800 space-y-2">
                      <h3 class="text-xs font-extrabold uppercase text-cyan-400">Descripción del Trabajo</h3>
                      <p class="text-sm text-slate-200 leading-relaxed whitespace-pre-line">${esc(stand.description || 'Sin descripción.')}</p>
                    </div>
                    <div class="p-5 rounded-2xl bg-slate-950/70 border border-slate-800 space-y-2">
                      <h3 class="text-xs font-extrabold uppercase text-indigo-400">Objetivo del Proyecto</h3>
                      <p class="text-sm text-slate-200 leading-relaxed whitespace-pre-line">${esc(stand.objective || 'Sin objetivo especificado.')}</p>
                    </div>
                  </div>

                  ${(stand.results || stand.extraInfo) ? `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                      ${stand.results ? `
                        <div class="p-5 rounded-2xl bg-slate-950/70 border border-slate-800 space-y-2">
                          <h3 class="text-xs font-extrabold uppercase text-emerald-400">Resultados Obtenidos</h3>
                          <p class="text-sm text-slate-200 whitespace-pre-line">${esc(stand.results)}</p>
                        </div>
                      ` : ''}
                      ${stand.extraInfo ? `
                        <div class="p-5 rounded-2xl bg-slate-950/70 border border-slate-800 space-y-2">
                          <h3 class="text-xs font-extrabold uppercase text-amber-400">Información Complementaria</h3>
                          <p class="text-sm text-slate-200 whitespace-pre-line">${esc(stand.extraInfo)}</p>
                        </div>
                      ` : ''}
                    </div>
                  ` : ''}

                  <div class="p-5 rounded-2xl bg-slate-950/70 border border-slate-800">
                    <h3 class="text-xs font-extrabold uppercase text-cyan-400 mb-3">Integrantes (${(stand.members || []).length})</h3>
                    <div class="flex flex-wrap gap-2">
                      ${(stand.members || []).length === 0
                        ? `<p class="text-xs text-slate-400">Sin integrantes registrados.</p>`
                        : stand.members.map(m => `<span class="px-3.5 py-1.5 rounded-xl bg-slate-900 border border-slate-700 text-xs font-semibold text-white">${esc(m)}</span>`).join('')}
                    </div>
                  </div>

                  ${(() => {
                    const resourceLinks = (stand.links || stand.photos || []).map(item =>
                      typeof item === 'string' ? { label: 'Abrir Documento / Drive del Proyecto', url: item } : item
                    );
                    if (resourceLinks.length === 0) return '';
                    return `
                      <div class="p-5 rounded-2xl bg-slate-950/70 border border-slate-800 space-y-3">
                        <h3 class="text-xs font-extrabold uppercase text-indigo-400 flex items-center gap-2">
                          <i data-lucide="folder-open" class="w-4 h-4"></i>
                          <span>Documentos, PDFs y Recursos del Proyecto (Drive / Web)</span>
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          ${resourceLinks.map(lnk => `
                            <a href="${esc(lnk.url)}" target="_blank" rel="noopener noreferrer" class="p-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 border border-indigo-500/30 hover:border-cyan-400 flex items-center justify-between gap-3 transition group">
                              <div class="flex items-center gap-3 min-w-0">
                                <div class="w-10 h-10 rounded-xl bg-indigo-500/15 border border-indigo-500/30 flex items-center justify-center text-indigo-300 group-hover:text-cyan-300 shrink-0">
                                  <i data-lucide="file-text" class="w-5 h-5"></i>
                                </div>
                                <div class="min-w-0">
                                  <p class="text-xs sm:text-sm font-bold text-white truncate group-hover:text-cyan-300">${esc(lnk.label || 'Ver Documento del Proyecto')}</p>
                                  <p class="text-[11px] text-slate-400 truncate">${esc(lnk.url)}</p>
                                </div>
                              </div>
                              <i data-lucide="external-link" class="w-4 h-4 text-cyan-400 shrink-0"></i>
                            </a>
                          `).join('')}
                        </div>
                      </div>
                    `;
                  })()}

                  <div class="pt-4 border-t border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <p class="text-xs text-slate-400">Confirma tu visita para obtener la insignia de este stand en tu Pasaporte Tecnológico.</p>
                    ${isVisited ? `
                      <button onclick="appActions.togglePassport(true)" class="w-full sm:w-auto px-8 py-4 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 font-extrabold text-sm">
                        ✓ VISITA REGISTRADA • VER PASAPORTE
                      </button>
                    ` : `
                      <button onclick="appActions.openConfirmVisitModal('${esc(stand.id)}')" class="w-full sm:w-auto px-8 py-4 rounded-2xl brand-gradient text-white font-extrabold text-sm uppercase shadow-xl">
                        MARCAR COMO VISITADO
                      </button>
                    `}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      return '';
    }

    // ====================================================
    // 7. RENDERIZADO DEL PANEL ADMINISTRATIVO
    // ====================================================
    function renderAdminInterface() {
      if (!state.isAdminUnlocked) {
        return `
          <div class="flex-1 flex items-center justify-center p-4">
            <div class="max-w-sm w-full bg-slate-900 border border-slate-800 rounded-3xl p-7 shadow-2xl text-center space-y-5">
              <div class="w-14 h-14 rounded-2xl bg-slate-950 border border-slate-800 mx-auto flex items-center justify-center text-cyan-400 shadow-inner">
                <i data-lucide="lock" class="w-6 h-6"></i>
              </div>
              <div>
                <span class="text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Acceso Restringido</span>
                <h2 class="text-xl font-extrabold text-white mt-1">Panel de Administración</h2>
                <p class="text-xs text-slate-400 mt-1">Ingresa la contraseña de administrador para gestionar la feria.</p>
              </div>
              <form onsubmit="appActions.unlockAdmin(event)" class="space-y-3 text-left">
                <div>
                  <input id="admin-password-input" type="password" placeholder="Contraseña..." class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 focus:border-cyan-400 focus:outline-none text-sm text-white text-center tracking-widest" autofocus required />
                  ${state.adminLoginError ? `
                    <p class="text-xs text-rose-400 mt-2 text-center font-semibold">${esc(state.adminLoginError)}</p>
                  ` : ''}
                </div>
                <div class="flex gap-2 pt-1">
                  <button type="button" onclick="appActions.setAppMode('visitor')" class="flex-1 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs">
                    Volver
                  </button>
                  <button type="submit" class="flex-1 py-3 rounded-xl brand-gradient text-white font-extrabold text-xs uppercase tracking-wider shadow-lg">
                    Ingresar
                  </button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      const fCfg = state.formConfig;
      const activePassportStands = state.stands.filter(s => s.status === 'published' && s.inPassport !== false);

      // Estadísticas de visitantes
      const visitorStatsList = state.visitors.map(v => {
        const vVisits = state.visits.filter(vis => vis.visitorId === v.id);
        const uniqueIds = new Set(vVisits.map(vis => vis.standId));
        const validVisited = activePassportStands.filter(s => uniqueIds.has(s.id)).length;
        const pct = activePassportStands.length > 0 ? Number(((validVisited / activePassportStands.length) * 100).toFixed(1)) : 0;
        const completed = activePassportStands.length > 0 && validVisited === activePassportStands.length;
        return { ...v, visitedCount: uniqueIds.size, pct, completed };
      });

      const completedCount = visitorStatsList.filter(v => v.completed).length;
      const avgProgress = visitorStatsList.length > 0
        ? Number((visitorStatsList.reduce((a, b) => a + b.pct, 0) / visitorStatsList.length).toFixed(1))
        : 0;

      let tabContent = '';

      // TAB: PERSONALIZAR PÁGINA DE INICIO (Sección 2)
      if (state.adminTab === 'home_editor') {
        const alignPreview = fCfg.logoPosition === 'left' ? 'justify-start' : fCfg.logoPosition === 'right' ? 'justify-end' : 'justify-center';
        tabContent = `
          <div class="space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">
              <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4">
                <div>
                  <span class="text-xs font-extrabold uppercase text-cyan-400">Módulo 2 • Configuración Institucional</span>
                  <h2 class="text-2xl font-extrabold text-white mt-0.5">PERSONALIZAR PÁGINA DE INICIO</h2>
                  <p class="text-xs text-slate-400 mt-1">Configura el logo oficial, nombres, colores y textos sin modificar el código.</p>
                </div>
                <div class="flex items-center gap-2.5">
                  <button onclick="appActions.saveInstitutionalConfig(false)" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs border border-slate-700">
                    Guardar como Borrador
                  </button>
                  <button onclick="appActions.saveInstitutionalConfig(true)" class="px-5 py-2.5 rounded-xl brand-gradient text-white font-extrabold text-xs shadow-lg">
                    Publicar Cambios
                  </button>
                </div>
              </div>

      const derived = getDerivedData();
      const mainView = state.appMode === 'admin'
        ? renderAdminInterface()
        : renderVisitorInterface(derived);

      root.innerHTML = `
        ${renderHeader()}
        <main class="flex-1 flex flex-col">
          ${mainView}
        </main>
        ${renderModals(derived)}
      `;

      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    // Iniciar vista de inmediato y conectar con Firebase
    updateBrandColors();
    renderApp();
    initFirebase();
  </script>
</body>
</html>
